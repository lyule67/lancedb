[workspace]
# hydra-arrow59: the Hydra fork builds the Rust crate only. The Python and Node
# bindings are left out of the workspace: on arrow 59 the Python binding's pyo3 0.28
# conflicts with arrow-pyarrow 59's pyo3 0.29 (both link `python`), and Hydra
# consumes neither binding.
members = ["rust/lancedb"]
exclude = ["nodejs", "python"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["LanceDB Devs <dev@lancedb.com>"]
license = "Apache-2.0"
repository = "https://github.com/lancedb/lancedb"
description = "Serverless, low-latency vector database for AI applications"
keywords = ["lancedb", "lance", "database", "vector", "search"]
categories = ["database-implementations"]
rust-version = "1.91.0"

[workspace.dependencies]
lance = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5", default-features = false }
lance-core = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-datagen = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-file = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-io = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5", default-features = false }
lance-index = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-linalg = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-namespace = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-namespace-impls = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5", default-features = false }
lance-table = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-testing = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-datafusion = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-encoding = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lance-arrow = { git = "https://github.com/lyule67/lance", rev = "ddd18246b6f425f462f7387495cba1e5f978a5d5" }
lancedb = { path = "rust/lancedb", default-features = false }
ahash = "0.8"
# Note that this one does not include pyarrow
arrow = { version = "59.2.0", optional = false }
arrow-array = "59.2.0"
arrow-buffer = "59.2.0"
arrow-data = "59.2.0"
arrow-ipc = "59.2.0"
arrow-ord = "59.2.0"
arrow-schema = "59.2.0"
arrow-select = "59.2.0"
arrow-cast = "59.2.0"
arrow-flight = { version = "59.2.0", features = ["flight-sql-experimental"] }
async-trait = "0"
bytes = "1"
datafusion = { version = "55.1.0", default-features = false }
datafusion-catalog = "55.1.0"
datafusion-common = { version = "55.1.0", default-features = false }
datafusion-execution = "55.1.0"
datafusion-expr = "55.1.0"
datafusion-functions = "55.1.0"
datafusion-physical-plan = "55.1.0"
datafusion-physical-expr = "55.1.0"
datafusion-sql = "55.1.0"
env_logger = "0.11"
half = { "version" = "2.7.1", default-features = false, features = [
    "num-traits",
] }
futures = "0.3"
log = "0.4"
metrics = "0.24"
metrics-util = "0.19"
moka = { version = "0.12", features = ["future"] }
object_store = "0.14.1"
pin-project = "1.0.7"
rand = "0.9"
snafu = "0.8"
url = "2"
num-traits = "0.2"
regex = "1.10"
semver = "1.0.25"
serde = "1"
serde_json = "1"
tempfile = "3.5.0"
tokio = { version = "1.23", features = ["rt-multi-thread", "sync"] }
tonic = { version = "0.14", features = ["tls-native-roots", "tls-ring"] }
uuid = { version = "1.7.0", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.ci]
debug = "line-tables-only"
inherits = "dev"
incremental = false

# This rule applies to every package except workspace members (dependencies
# such as `arrow` and `tokio`). It disables debug info and related features on
# dependencies so their binaries stay smaller, improving cache reuse.
[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false

